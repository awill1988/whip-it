[project]
name = "whip-it"
version = "0.1.0"
description = "Agent-planning guardrail and simplification hook for Claude Code, Antigravity CLI, and Codex"
authors = [{ name = "Adam Williams", email = "adam@williams.engineer" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/awill1988/whip-it"

[project.scripts]
whip-it = "whipit.cli:main"

[tool.poetry]
packages = [{ include = "whipit", from = "src" }]
include = [
    { path = "hooks", format = "sdist" },
    { path = "scripts", format = "sdist" },
    { path = "tests", format = "sdist" },
    { path = "config", format = "sdist" },
]

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402", "I001"]
"tests/*.py" = ["E402", "I001"]
"tools/**/*.py" = ["E402", "I001"]

[dependency-groups]
dev = [
    "ruff (>=0.14,<1)"
]
