name: CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  commit_lint:
    name: Conventional Commit Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run commit checker test suite
        run: |
          python3 tools/commit_check/test_commit_check.py

      - name: Lint pull request commits and title
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 tools/commit_check/commit_check.py --range "$BASE_SHA" "$HEAD_SHA"
          printf '%s\n' "$PR_TITLE" | python3 tools/commit_check/commit_check.py

      - name: Lint new branch commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 tools/commit_check/commit_check.py --range "$BEFORE_SHA" HEAD

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: [ commit_lint ]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry project
        run: |
          python -m pip install poetry
          poetry install --no-interaction
          poetry check --lock --strict

      - name: Run unit test suite
        run: |
          poetry run python -m unittest discover -s tests -p "test_*.py" -v
          poetry run python -m unittest discover -s tools/adversarial_reviewer -p "test_*.py" -v
          python3 tools/commit_check/test_commit_check.py

      - name: Run simulated hook integrations
        run: |
          poetry run python scripts/whip_it.py test-prompt "Refactor parser, keep it simple, no subagents"
          poetry run python scripts/whip_it.py status
          echo '{"toolCall":{"name":"invoke_subagent","args":{"Subagents":[{"Role":"W"}]}},"conversationId":"ci-test"}' | poetry run python scripts/whip_it.py --client antigravity --event PreToolUse
          echo '{"tool_name":"Agent","tool_input":{"prompt":"do it"},"session_id":"ci-test"}' | poetry run python scripts/whip_it.py --client claude --event PreToolUse
          echo '{"tool_name":"spawn_agent","tool_input":{},"session_id":"ci-test"}' | poetry run python scripts/whip_it.py --client codex --event PreToolUse

  lint-and-validate:
    name: Lint & Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry project
        run: |
          python -m pip install poetry
          poetry install --no-interaction
          poetry check --lock --strict
          poetry build
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Validate JSON syntax
        run: |
          poetry run python -c "import json; from pathlib import Path; [json.loads(p.read_text()) for p in Path('.').rglob('*.json') if not {'.git', '.venv', 'dist'}.intersection(p.parts)]"

      - name: Verify isolated wheel installation
        run: |
          python -m venv "$RUNNER_TEMP/whip-it-wheel"
          "$RUNNER_TEMP/whip-it-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/whip-it-wheel/bin/whip-it" --version
          "$RUNNER_TEMP/whip-it-wheel/bin/whip-it" config
          "$RUNNER_TEMP/whip-it-wheel/bin/whip-it" test-prompt "keep it simple, no subagents"

      - name: Verify Python syntax
        run: |
          poetry run python -m compileall -q src scripts tests
