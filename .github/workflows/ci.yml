name: CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry project
        run: |
          python -m pip install poetry
          poetry install --no-interaction
          poetry check --lock --strict

      - name: Run unit test suite
        run: |
          poetry run python -m unittest discover -s tests -p "test_*.py" -v

  lint-and-validate:
    name: Lint & Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry project
        run: |
          python -m pip install poetry
          poetry install --no-interaction
          poetry check --lock --strict
          poetry build
          poetry run ruff check .
          poetry run ruff format --check .

      - name: Validate JSON syntax
        run: |
          poetry run python -c "import json; from pathlib import Path; [json.loads(p.read_text()) for p in Path('.').rglob('*.json') if not {'.git', '.venv', 'dist'}.intersection(p.parts)]"

      - name: Verify isolated wheel installation
        run: |
          python -m venv "$RUNNER_TEMP/whip-it-wheel"
          "$RUNNER_TEMP/whip-it-wheel/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/whip-it-wheel/bin/whip-it" --version
          "$RUNNER_TEMP/whip-it-wheel/bin/whip-it" config
          "$RUNNER_TEMP/whip-it-wheel/bin/whip-it" test-prompt "keep it simple, no subagents"

      - name: Verify Python syntax
        run: |
          poetry run python -m compileall -q src scripts tests
