name: native executables

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: install toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - name: install musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools strace
          echo 'RUSTFLAGS=-C linker=musl-gcc' >> "$GITHUB_ENV"
      - name: format and lint
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets --no-default-features --target ${{ matrix.target }} -- -D warnings
          cargo clippy --locked --all-targets --features diagnostics --target ${{ matrix.target }} -- -D warnings
      - name: test and build
        run: |
          python -m unittest tests.test_state
          cargo test --locked --no-default-features --target ${{ matrix.target }}
          cargo test --locked --features diagnostics --target ${{ matrix.target }}
          cargo build --locked --release --no-default-features --target ${{ matrix.target }}
          cargo build --locked --release --features diagnostics --target-dir target/diagnostics --target ${{ matrix.target }}
      - name: verify and package
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/whip-it"
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          python scripts/verify_native.py --executable "$binary"
          diagnostic="target/diagnostics/${{ matrix.target }}/release/whip-it"
          if [ "$RUNNER_OS" = Windows ]; then diagnostic="$diagnostic.exe"; fi
          python scripts/verify_native.py --executable "$diagnostic" --diagnostics
          python scripts/verify_observations.py --executable "$diagnostic"
          audit=()
          if [ "$RUNNER_OS" = Linux ]; then audit=(--network-audit); fi
          python scripts/verify_release.py --executable "$binary" --depfile "target/${{ matrix.target }}/release/whip-it.d" "${audit[@]}"
          python benchmarks/run.py --executable "$binary" --samples 100 --observations --output "dist/benchmarks/${{ matrix.target }}.json"
          python examples/run.py --executable "$binary"
          python scripts/package_native.py --binary "$binary" --target "${{ matrix.target }}" --output dist/native
      - name: verify installer
        shell: bash
        env:
          WHIP_IT_TEST_EXECUTABLE: target/${{ matrix.target }}/release/whip-it.exe
        run: python -m unittest discover -s tests -p 'test_installers.py'
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.target }}
          path: dist/benchmarks/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: whip-it-${{ matrix.target }}
          path: dist/native/*
          if-no-files-found: error

  publish:
    needs: [build, universal_macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: whip-it-*
          path: dist/native
          merge-multiple: true
      - name: verify release identity and assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 - <<'PY'
          import hashlib, os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'tag must match package version'
          checksums = list(pathlib.Path('dist/native').glob('*.sha256'))
          assert len(checksums) == 7, 'all platform archives must be present'
          for checksum in checksums:
              archive = checksum.with_suffix('')
              assert hashlib.sha256(archive.read_bytes()).hexdigest() == checksum.read_text().split()[0]
          PY
      - name: publish release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/native/* install.sh install.ps1 \
            --verify-tag --title "$RELEASE_TAG" \
            --notes 'Native executables for macOS, Linux, and Windows. Installers download and verify the matching archive during explicit setup. Hook execution remains local. See README for client installation and verification.'
  universal_macos:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: whip-it-*-apple-darwin
          path: artifacts
      - name: combine architectures
        run: |
          mkdir -p target/universal/intel target/universal/arm
          tar -xzf artifacts/whip-it-x86_64-apple-darwin/*.tar.gz -C target/universal/intel
          tar -xzf artifacts/whip-it-aarch64-apple-darwin/*.tar.gz -C target/universal/arm
          lipo -create target/universal/intel/whip-it target/universal/arm/whip-it -output target/universal/whip-it
          codesign --force --sign - target/universal/whip-it
          lipo target/universal/whip-it -verify_arch x86_64
          lipo target/universal/whip-it -verify_arch arm64
          python3 scripts/package_native.py --binary target/universal/whip-it --target universal-apple-darwin --output dist/native
      - uses: actions/upload-artifact@v4
        with:
          name: whip-it-universal-apple-darwin
          path: dist/native/*
