name: Adversarial Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base ref to compare against'
        required: false
        default: 'origin/main'

permissions:
  contents: read

concurrency:
  group: adversarial-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review_scope:
    name: Select reviewer qualification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      qualify: ${{ steps.scope.outputs.qualify }}
    steps:
      - uses: actions/github-script@v7
        id: scope
        with:
          script: |
            core.setOutput('qualify', String(context.eventName === 'workflow_dispatch'));
            if (!context.payload.pull_request || context.payload.pull_request.draft) return;
            const params = {...context.repo, pull_number: context.issue.number, per_page: 100};
            const files = await github.paginate(github.rest.pulls.listFiles, params);
            const qualifies = files.some(f =>
              [f.filename, f.previous_filename || ''].some(path =>
                path.startsWith('tools/adversarial_reviewer/') ||
                path === '.github/workflows/adversarial-review.yml'));
            core.setOutput('qualify', String(qualifies));

  adversarial_review:
    name: Adversarial Code Review
    environment:
      name: default
      deployment: false
    outputs:
      report_artifact: ${{ steps.report.outputs.artifact-id }}
    needs: review_scope
    if: >-
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check review credentials
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          TRUSTED_SOURCE: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$TRUSTED_SOURCE" != "true" ]; then
            echo "::error::kimi review unavailable for fork pull requests; maintainer review is required"
            exit 1
          fi
          if [ -z "$KIMI_API_KEY" ]; then
            echo "::error::missing KIMI_API_KEY repository secret"
            exit 1
          fi

      - name: Qualify Kimi reviewer
        if: needs.review_scope.outputs.qualify == 'true'
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: python3 tools/adversarial_reviewer/evaluate_model.py

      - name: Run Adversarial Code Review
        id: review
        continue-on-error: true
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_ref || 'origin/main' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 tools/adversarial_reviewer/adversarial_review.py \
            --base "$BASE_REF" \
            --head "$HEAD_SHA" \
            --target "pull request diff" \
            --json-output review-result/report.json \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --fail-on request-changes

      - uses: actions/upload-artifact@v4
        id: report
        if: always() && steps.review.outcome != 'skipped'
        with:
          name: adversarial-review-result
          path: review-result/report.json
          if-no-files-found: error

      - name: Require completed review
        if: steps.review.outcome != 'success'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("review-result/report.json")
          summary = json.loads(path.read_text())["summary"] if path.exists() else "review did not complete; inspect credential and qualification steps"
          escaped = summary.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error::{escaped}")
          raise SystemExit(1)
          PY

  publish_review:
    name: Submit pull request review
    needs: [review_scope, adversarial_review]
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      needs.adversarial_review.result != 'skipped' &&
      needs.adversarial_review.outputs.report_artifact != '' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: adversarial-review-result
          path: review-result
      - uses: actions/github-script@v7
        env:
          REVIEW_JOB_RESULT: ${{ needs.adversarial_review.result }}
        with:
          script: |
            const fs = require('fs');
            const path = 'review-result/report.json';
            if (fs.statSync(path).size > 1024 * 1024) throw new Error('review report exceeds 1 MiB');
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const expected = context.payload.pull_request.head.sha;
            if (report.commit_id !== expected) throw new Error('review commit mismatch');
            const params = {...context.repo, pull_number: context.issue.number};
            const {data: pr} = await github.rest.pulls.get(params);
            if (pr.head.sha !== expected || pr.state !== 'open' || pr.draft) {
              core.notice('review superseded or pull request not ready');
              return;
            }
            const complete = report.complete === true &&
              Number.isSafeInteger(report.total_lines) && report.total_lines > 0 &&
              report.reviewed_lines === report.total_lines &&
              Number.isSafeInteger(report.total_chunks) && report.total_chunks > 0 &&
              report.completed_chunks === report.total_chunks &&
              Array.isArray(report.chunks) && report.chunks.length === report.total_chunks &&
              report.chunks.every(c => c.complete === true &&
                ['APPROVE', 'COMMENT', 'REQUEST_CHANGES'].includes(c.disposition) &&
                typeof c.summary === 'string' && c.summary.trim() &&
                Array.isArray(c.findings) &&
                (c.disposition === 'REQUEST_CHANGES' ? c.findings.length > 0 : c.findings.length === 0) &&
                c.findings.every(f => typeof f.file === 'string' && /:\d+$/.test(f.file) &&
                  typeof f.evidence === 'string' && f.evidence.trim() &&
                  typeof f.details === 'string' && f.details.trim()));
            let event = 'COMMENT';
            if (complete && report.chunks.some(c => c.disposition === 'REQUEST_CHANGES')) {
              event = 'REQUEST_CHANGES';
            } else if (complete && report.disposition === 'APPROVE' &&
                       process.env.REVIEW_JOB_RESULT === 'success' &&
                       report.chunks.every(c => c.disposition === 'APPROVE')) {
              event = 'APPROVE';
            }
            const body = report.body;
            if (typeof body !== 'string' || !body.trim() || body.length > 60000) {
              throw new Error('missing or oversized review body');
            }
            if (/co-authored-by|generated-by|assisted-by|reviewed with|🤖/i.test(body)) {
              throw new Error('review body contains forbidden attribution');
            }
            const marker = '<!-- whip-it-review -->';
            const reviews = await github.paginate(github.rest.pulls.listReviews, params);
            const states = {APPROVE:'APPROVED', COMMENT:'COMMENTED', REQUEST_CHANGES:'CHANGES_REQUESTED'};
            if (reviews.some(r => r.user.login === 'github-actions[bot]' &&
                r.commit_id === expected && r.state === states[event] && r.body.includes(marker))) {
              core.notice('review already submitted for this commit');
              return;
            }
            await github.rest.pulls.createReview({...params, commit_id: expected, event,
              body: `${marker}\n${body}`});
